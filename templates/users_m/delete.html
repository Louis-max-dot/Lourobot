<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Confirmation</title>
  <style>
    /* 1. Reset default spacing */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      /* Simulating the background of your website */
      background-color: #f3f4f6;
      height: 100vh;
    }

    /* 2. The Dark Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(2px); /* Blurs the background content slightly */
    }

    /* 3. The Modal Card */
    .modal-container {
      background: #ffffff;
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    /* 4. The Warning Icon */
    .modal-icon {
      width: 48px;
      height: 48px;
      background-color: #fee2e2; /* Light red */
      color: #dc2626; /* Dark red */
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
      font-size: 24px;
      font-weight: bold;
    }

    /* 5. Typography */
    .modal-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 6. Action Buttons */
    .modal-actions {
      display: flex;
      gap: 12px;
    }

     button, a.btn {
      flex: 1; /* Makes buttons equal width */
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    a{
        flex: 1;
        text-decoration: none;
    }

    a.btn-cancel {
      background-color: #f3f4f6;
      color: #374151;
    }

    a.btn-cancel:hover {
      background-color: #e5e7eb;
    }

    .btn-delete {
      background-color: #dc2626;
      color: white;
    }

    .btn-delete:hover {
      background-color: #b91c1c;
    }
    form{
      display: grid;
      width: 50%;
    }
  </style>
</head>
<body>

  <!-- The Background Overlay -->
  <div class="modal-overlay">
    
    <!-- The White Modal Card -->
    <div class="modal-container">
      
      <div class="modal-icon">!</div>
      <h2 class="modal-title">Do you really want to be deleted amd miss out from the training program coming up?</h2>
      <p class="modal-description">This action cannot be undone. This will permanently remove it from the system.</p>
      
      <div class="modal-actions">
        <!-- <button class="btn-cancel">Cancel</button> -->
         <a href="{% url 'users_list' %}" class=" btn btn-cancel">Cancel</a>
         <form action="" method="post">
            {% csrf_token %}
             <button class="btn-delete">Delete</button>

         </form>
      </div>

    </div>
    
  </div>

</body>
</html>

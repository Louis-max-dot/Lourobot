<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Details</title>
    <style>
      /* Reset default margins and set a clean font */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Center the form on the screen with a light gray background */
      body {
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* Style the white card container */
      .form-container {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      /* Center the heading */
      .form-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      /* Space out the input fields */
      .input-group {
        margin-bottom: 15px;
      }

      /* Style the text labels */
      .input-group label,
      .input-group textarea {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: 500;
        font-size: 14px;
      }

      /* Style the text inputs */
      .input-group input,
      .input-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
        transition: border-color 0.3s ease;
      }
      .input-group textarea {
        resize: none; /* Allows the user to make the box taller, but not wider */
        min-height: 100px;
      }

      /* Add a blue highlight when typing */
      .input-group input:focus,
      .input-group textarea:focus {
        border-color: #007bff;
        outline: none;
      }

      /* Style the submit button */
      button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 10px;
      }

      /* Darken the button when hovering over it */
      button:hover {
        background-color: #0056b3;
      }
      h3 {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2>Edit Details</h2>
      {% for message in messages %}
      <p class="error">{{message}}</p>
      {%endfor%}

      <form action="" method="post">
        {% csrf_token %}

        <div class="input-group">
          <label for="firstName">Username</label>
          <input
            type="text"
            id="firstName"
            name="username"
            placeholder="e.g. Jane"
            value="{{user_to_edit.username}}"
          />
        </div>

        <div class="input-group">
          <label for="lastName">Email</label>
          <input
            type="text"
            id="lastName"
            name="email"
            placeholder="e.g. Doe"
            value="{{profile_to_edit.email}}"
          />
        </div>

        <div class="input-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Describe yourself..."
          >
{{profile_to_edit.message}}</textarea
          >
        </div>

        <button type="submit">Update Details</button>
      </form>
    </div>
  </body>
</html>

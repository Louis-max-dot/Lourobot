<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Trainee</title>
    <style>
      /* Base page styling */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .error {
        color: white;
        text-align: center;
        /* justify-content: center; */
        background-color: red
      }
      .success{
        color: white;
        /* align-items: center;
        justify-content: center; */
        background-color: green ;
        text-align: center;
      }

      /* Form container card */
      .form-container {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
      }

      .form-container h2 {
        margin-top: 0;
        margin-bottom: 25px;
        color: #333;
        text-align: center;
      }

      /* Grouping labels and inputs */
      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 14px;
      }

      /* Input and textarea styling */
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; /* Prevents padding from breaking width */
        font-family: inherit;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }

      /* Highlight field when typing */
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: #0066ff;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 102, 255, 0.2);
      }

      /* Submit button styling */
      button {
        width: 100%;
        padding: 12px;
        background-color: #0066ff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #0052cc;
      }
      .signup {
        text-align: center;
        margin-top: 22px;
      }
      .signup a {
        text-decoration: none;
        font-weight: 600;
        color: #2c4c41;
      }
      .signup a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <form action="" method="post">
      {% csrf_token %}

      <div class="form-group">
        <h1>TRAINEE CREATION FORM</h1>
        {% for message in messages %} 
          {% if message.tags == "success" %}
             <p class="success">{{message}}</p>
          {% else %}
             <p class="error">{{message}}</p>
          {% endif %} 
        {% endfor %}
        <label for="name">Username: </label>
        <input type="text" id="name" name="username" placeholder="John Doe" />
      </div>
      <!-- <div class="form-group">
        <label for="email">Email: </label>
        <input type="email" id="name" name="email" placeholder="email" />
      </div> -->
      <div class="form-group">
        <label for="password">Password: </label>
        <input
          type="password"
          id="name"
          name="password"
          placeholder="Enter your password"
        />
      </div>
      <div class="form-group">
        <label for="password">Confirm Password: </label>
        <input
          type="password"
          id="name"
          name="confirm_password"
          placeholder="Confirm your password"
        />
      </div>
      <button type="submit">Submit</button>
      <p class="signup">
          Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    
    </form>
  </body>
</html>
